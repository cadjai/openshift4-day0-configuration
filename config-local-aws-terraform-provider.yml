#!/usr/bin/ansible-playbook --inventory=inventory
- name: vars overlay
  hosts: localhost
  gather_facts: true
  vars:
    git_repo_branch: ''
    stage_dir: ''
    separate_git_dir: "{{ stage_dir }}/repo"
    project_dir: "{{ stage_dir }}/project"
    cluster_dir: ''
    git_repo: ''
    #Leave blank if executing locally, otherwises use saved credential from AAP Controller
    ssh_private_key_file: "{{ lookup('env', 'SSH_GIT_PRIVATE_KEY') | default(omit) }}"

  pre_tasks:
    - name: Ensure the cluster dir variable is set to a valid value
      ansible.builtin.assert:
        that:
          - cluster_dir is defined and cluster_dir != ""
        msg: " the cluster_dir must be set and valid "

    - name: Ensure the cluster git_repo  is set to a valid value if ssh private key not provided
      ansible.builtin.assert:
        that:
          - git_repo is defined and git_repo != ""
        msg: " the git_repo must be set and valid  when te ssh private key file not provided"
      when:
        - not ssh_private_key_file is defined or ssh_private_key_file == ''

    #- name: '{{ ansible_name_module }} | set_fact | git_repo '
    #  ansible.builtin.set_fact:
    #    git_repo: ""
    #  when:
    #    - not git_repo is defined
    #    - ssh_private_key_file is defined
    #    - ssh_private_key_file != ""

    - name: '{{ ansible_name_module }} | set_fact | git_repo_branch '
      ansible.builtin.set_fact:
        git_repo_branch: "main"
      when:
        - not git_repo_branch is defined or git_repo_branch == ''


    - name: '{{ ansible_name_module }} | set_fact | stage_dir '
      ansible.builtin.set_fact:
        stage_dir: "{{ lookup('env', 'HOME') }}/tmp"
      when:
        - not stage_dir is defined or stage_dir == ''

    - name: clean up tmp
      ansible.builtin.command: rm -rf {{ stage_dir }}

    - name: '{{ ansible_name_module }} | ansible.builtin.file | Ensure the staging dir exist '
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: 0777
      loop:
        - "{{ stage_dir }}"
        - "{{ stage_dir }}/platform"

    - ansible.builtin.debug:
        var: ssh_private_key_file

    - name: Checkout the vars variables uploads
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ project_dir }}"
        #separate_git_dir: "{{ separate_git_dir }}"
        single_branch: yes
        version: main
        update: yes
        key_file: "{{ ssh_private_key_file | default(omit) }}"
        remote: "{{ git_repo_branch }}"
        ssh_opts: "-o StrictHostKeyChecking=no"
      when:
        - git_repo is defined and git_repo != ''
        - cluster_dir is defined and cluster_dir != ''

    - name: Copy new variables
      ansible.builtin.copy:
        src: "{{ project_dir }}/{{ cluster_dir }}/vars/"
        dest: "{{ playbook_dir }}/vars"
        mode: '0655'
        directory_mode: '0755'
      when:
        - git_repo is defined and git_repo != ''
        - cluster_dir is defined and cluster_dir != ''

    - name: Remove decrypted vault file
      ansible.builtin.file:
        path: "{{ playbook_dir }}/vars/vault.yml"
        state: absent

    - name: Using shell to copy the vault file into place so that it is not decrypted
      ansible.builtin.command: >
        cp {{ project_dir }}/{{ cluster_dir }}/vars/vault.yml {{ playbook_dir }}/vars/


- name: "Konductor | Provision UPI Infra | config-local-aws-terraform-provider.yml"
  hosts: localhost
  vars_files:
  - vars/vault.yml
  - vars/bastion.yml
  - vars/cluster.yml
  - vars/fabric.yml
  vars:
    module: "configure-aws-terraform-provider-local"
  tasks:
    - name: '{{ ansible_name_module }} | install aws terraform provider'
      when:
        - install_terraform_provider is defined
        - install_terraform_provider | bool
      block:
        - name: '{{ ansible_name_module }} | shell | get installed tf version '
          shell: terraform version | head -n 1 | awk '{print $2}'
          ignore_errors: true
          register: ter_ver 

        - name: '{{ ansible_name_module }} | file:state=directory | Ensure terraform provider directory exist '
          file:
            path: "{{ terraform_provider_dir }}"
            state: directory
            recurse: true

        - name: '{{ ansible_name_module }} | file:state=directory | for each provider '
          file:
            path: "{{ terraform_provider_dir }}/{{ terraform_domain }}/{{ terraform_namespace }}/{{ install_terraform_provider_name }}/{{ install_terraform_provider_version }}/{{ terraform_provider_type }}"
            state: directory
            recurse: true

        - name: '{{ ansible_name_module }} | unarchive | bundle provider files to host'
          unarchive:
            src: "{{ install_terraform_provider_binary }}"
            remote_src: yes
            dest: "{{ terraform_provider_dir }}/{{ terraform_domain }}/{{ terraform_namespace }}/{{ install_terraform_provider_name }}/{{ install_terraform_provider_version }}/{{ terraform_provider_type }}"
            mode: 0755
          register: unbundle_out

    - name: '{{ ansible_name_module }} | Configure aws terraform provider'
      when:
        - (install_terraform_provider is defined and install_terraform_provider | bool) or (config_terraform_provider is defined and config_terraform_provider | bool)
      block:
        - name: '{{ ansible_name_module }} | template | create terraform provider v14 config file'
          template:
            src: "templates/terraformrc-aws.j2"
            dest: "{{ terraform_provider_dir }}/main.tf"
            mode: 0755
            force: yes

        #- name: '{{ ansible_name_module }} | template | create terraform provider v14 config file'
        #  template:
        #    src: "templates/provider-local.j2"
        #    dest: "{{ terraform_provider_dir }}/provider.tf"
        #    mode: 0755
        #    force: yes

        #- name: '{{ ansible_name_module }} | shell:terraform.init | Initilize terraform provider module'
        #  shell: >
        #    cd {{ terraform_provider_dir }} && terraform init && terraform plan
        #  failed_when:
        #    - terraform_init.rc > 1
        #    - " not 'not available for installation' in terraform_init.stderr "
        #  register: terraform_init

        - name: '{{ ansible_name_module }} | shell:terraform.init | Initilize terraform provider module'
          shell:
            cmd: terraform init 
            chdir: "{{ terraform_provider_dir }}"
          failed_when:
            - terraform_init.rc > 1
            - " not 'not available for installation' in terraform_init.stderr "
          register: terraform_init

