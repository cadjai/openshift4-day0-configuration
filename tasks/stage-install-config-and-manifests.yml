---
- name: '{{ ansible_name_module }} | template | Stage OpenShift Configs & Manifests'
  ansible.builtin.template:
    src: '{{ platform_openshift_staging_dir }}/templates/install-config.yaml.j2'
    dest: '{{ platform_staging_dir }}/cluster/config/install-config.yaml'
    mode: '0755'
  when:
    - not aws_private_vpc_subnet_id_list is defined  or aws_private_vpc_subnet_id_list | d([], true) | length == 0 

- name: '{{ ansible_name_module }} | template | Stage OpenShift Configs & Manifests'
  ansible.builtin.template:
    src: '{{ platform_openshift_staging_dir }}/templates/install-config-network.yaml.j2'
    dest: '{{ platform_staging_dir }}/cluster/config/install-config.yaml'
    mode: '0755'
  when:
    - aws_private_vpc_subnet_id_list is defined 
    - aws_private_vpc_subnet_id_list | length > 0 

