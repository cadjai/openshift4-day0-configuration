---
- name: '{{ ansible_name_module }} | shell:aws | retrieve oidc provider arn when not provided '
  ansible.builtin.shell: >
    {{ aws_cli }} iam list-open-id-connect-providers --query  "OpenIDConnectProviderList[*].Arn" | egrep -i "{{ cluster_name }}|sts|oidc" | cut -d "," -f1  | sed 's~"~~g' 
  when:
    - not oidc_provider_arn is defined or oidc_provider_arn == ''
  register: ocp_aws_openid_idp_arn_out

- name: '{{ ansible_name_module }} | set_fact | oidc_provider_arn '
  ansible.builtin.set_fact:
    oidc_provider_arn: "{{ ocp_aws_openid_idp_arn_out.stdout | trim }}"
  when:
    - ocp_aws_openid_idp_arn_out is defined
    - ocp_aws_openid_idp_arn_out.rc is defined
    - ocp_aws_openid_idp_arn_out.rc == 0 
    - ocp_aws_openid_idp_arn_out.stdout is defined
    - ocp_aws_openid_idp_arn_out.stdout != '' 

- name: '{{ ansible_name_module }} | shell:aws | retrieve oidc provider url '
  ansible.builtin.shell: >
    {{ aws_cli }} iam get-open-id-connect-provider --open-id-connect-provider-arn  {{ oidc_provider_arn }} | grep "Url" | awk '{print $2}'  | cut -d ',' -f 1 | cut -d '"' -f 2
  ignore_errors: true
  register: ocp_aws_openid_idp_url_out

- name: Print {{ aws_sts_oidc_provider_url }}
  ansible.builtin.debug:
    var: aws_sts_oidc_provider_url 
    verbosity: 2

- name: '{{ ansible_name_module }} | Ensure the retrieved oidc provider url matches aws_sts_oidc_provider_url '
  ansible.builtin.assert:
    that:
      - ocp_aws_openid_idp_url_out is defined
      - ocp_aws_openid_idp_url_out.rc is defined
      - ocp_aws_openid_idp_url_out.rc == 0
      - ocp_aws_openid_idp_url_out.stdout is defined
      - ocp_aws_openid_idp_url_out.stdout != ''
      - ocp_aws_openid_idp_url_out.stdout in aws_sts_oidc_provider_url
    msg: " The oidc provider url has to match the url set in the variables "

- name: '{{ ansible_name_module }} | create ocp components IAM roles using ccoctl '
  when:
    - use_ccoctl is defined
    - use_ccoctl | bool 
  block:
    ####### AWS OCP Component IAM roles 
    - name: '{{ ansible_name_module }} | shell:aws | retrieve existing ocp components aws iam roles '
      ansible.builtin.shell: >
        {{ aws_cli }} iam list-roles --query 'Roles[?starts_with(RoleName, `{{ ccoctl_manifest_tag_name }}-openshift-`)].RoleName' | jq .[] 
      ignore_errors: true
      register: ocp_components_aws_iam_roles_exist_out

    - name: '{{ ansible_name_module }} | Ensure there are no existing ocp component iam  '
      ansible.builtin.assert:
        that:
          - ocp_components_aws_iam_roles_exist_out is defined
          - ocp_components_aws_iam_roles_exist_out.rc is defined
          - ocp_components_aws_iam_roles_exist_out.rc == 0 
          - ocp_components_aws_iam_roles_exist_out.stdout_lines is defined
          - ocp_components_aws_iam_roles_exist_out.stdout_lines | length == 0 

    - name: '{{ ansible_name_module }} | shell:ccoctl | AWS OCP Component IAM roles'
      ansible.builtin.shell: >
        {{ ccoctl_cli }} aws create-iam-roles --name={{ ccoctl_manifest_tag_name }} \
        --region={{ aws_region }} --credentials-requests-dir={{ cloud_cred_manifests_dir }} \
        --identity-provider-arn={{ oidc_provider_arn }}
      register: ocp_components_aws_iam_roles_created

- name: '{{ ansible_name_module }} | create ocp components IAM roles using aws cli '
  when:
    - not use_ccoctl is defined or not use_ccoctl | bool 
  block:
    - name: '{{ ansible_name_module }} | set_fact | iam_role_prefix '
      ansible.builtin.set_fact:
        iam_role_prefix: "05-"
      when:
        - not iam_role_prefix is defined or iam_role_prefix == ""
    
    - name: '{{ ansible_name_module }} | set_fact | iam_policy_prefix '
      ansible.builtin.set_fact:
        iam_policy_prefix: "06-"
      when:
        - not iam_policy_prefix is defined or iam_policy_prefix == ""
    
    #######  find AWS IAM role policies to apply
    - name: '{{ ansible_name_module }} | find |  Find all IAM policy manifest files'
      ansible.builtin.find:
        path: "{{ ccoctl_manifests_dir }}"
        recurse: yes
        patterns: "*-policy.json"
      register: iam_policy_raw_manifests
    
    - name: '{{ ansible_name_module }} | set_fact | iam_policy_manifests_paths file paths'
      ansible.builtin.set_fact:
        iam_policy_manifests_paths: "{{ iam_policy_raw_manifests.files | map(attribute='path') | list }}"
      when:
        - iam_policy_raw_manifests is defined
        - iam_policy_raw_manifests.files is defined
        - iam_policy_raw_manifests.files | length > 0
    
    ####### Instantiate AWS IAM policies for CCOCTL for cluster
    - name: '{{ ansible_name_module }} | shell:oc | Extract '
      ansible.builtin.shell: >
        {{ aws_cli }} iam create-role --role-name {{ role_name }} --assume-role-policy-document file://{{ item }} --cli-input-json file://{{ role_file_dir }}/{{ role_file }}
      loop: "{{ iam_policy_manifests_paths }}"
      when:
        - iam_policy_manifests_paths is defined
        - iam_policy_manifests_paths | default([], true) | length > 0
      vars:
        role_name: "{{ ((item.split(iam_policy_prefix)[1]).split('-policy.json')[0]).split('0-')[1] }}"
        role_file: "{{ (iam_role_prefix + item.split(iam_policy_prefix)[1]).split('-policy.json')[0] + '-role.json' }}"
        role_file_dir: "{{ item | dirname }}"
      register: iam_policies_created

####### Instantiate AWS IAM user for CCOCTL for cluster
- name: '{{ ansible_name_module }} | create and attach role to iam user '
  when:
    - attach_ccoctl_iam_to_user is defined
    - attach_ccoctl_iam_to_user | bool
  block:
    - name: '{{ ansible_name_module }} | shell:aws | Create ccoctl iam user '
      ansible.builtin.shell: >
        {{ aws_cli }} iam create-user --user-name openshift-{{ ccoctl_manifest_tag_name }}
      when:
        - create_sts_iam_user is defined
        - create_sts_iam_user | bool
      register: ocp_ccoctl_iam_user_created
    
    - name: '{{ ansible_name_module }} | shell:aws | Create ccoctl iam user '
      ansible.builtin.shell: >
        {{ aws_cli }} iam get-user  --user-name openshift-{{ ccoctl_manifest_tag_name }}
      when:
        - not create_sts_iam_user is defined or not create_sts_iam_user | bool
      register: ocp_ccoctl_iam_user_retrieved
    
    ####### Attach AWS IAM CCOCTL policy to user for cluster
    - name: '{{ ansible_name_module }} | shell:aws | Create ccoctl iam user '
      ansible.builtin.shell: >
        {{ aws_cli }} iam attach-user-policy --user-name openshift-{{ ccoctl_manifest_tag_name }}  --policy-arn {{ (item.stdout | from_json).Role.Arn }}
      loop: "{{ iam_policies_created.results }}"
      when:
        - iam_policies_created is defined
        - iam_policies_created.results is defined
        - iam_policies_created.results | length > 0
        - item is defined
        - item.stdout is defined
        - item.stdout != ''
      register: iam_policies_attached

