---
- name: vars overlay
  hosts: localhost
  gather_facts: true
  vars_files:
    vars/vault.yml
    vars/bastion.yml
    vars/cluster.yml
    vars/fabric.yml
  vars:
     module: "vars overlay"
     ansible_name_module: "Pre Cluster Installation | {{ module }}"

  tasks:
    - name: '{{ ansible_name_module }} | import_tasks | Import variable overlay tasks'
      ansible.builtin.include_tasks: tasks/repo-overlay.yml
      when:
        - run_overlay_var is defined
        - run_overlay_var | bool

- hosts: localhost
  vars_files:
  - vars/vault.yml
  - vars/bastion.yml
  - vars/environment.yml
  - vars/cluster.yml
  - vars/fabric.yml
  vars:
     module: "install clients"
     ansible_name_module: "Pre Cluster Installation | {{ module }}"

  tasks:
    - name: Make sure unzip is installed
      yum:
        name: unzip
        state: present
      become: 'true'

    - name: Download binaries
      get_url:
        url: "https://{{ binary_location }}/{{ item }}"
        dest: "/tmp/{{ item }}"
        username: "{{ vault_registry_admin_username }}"
        password: "{{ vault_registry_admin_password }}"
        force_basic_auth: 'true'
      with_items:
        - "{{ oc_client_binary }}"
        - "{{ oc_installer_binary }}"
        - "{{ terraform_binary }}"
        - "{{ terraform_provider_binary }}"

    - name: Unpack oc binaries
      unarchive:
        src: "/tmp/{{ item }}"
        dest: /usr/bin/
      failed_when:
        - oc_clients_unpacked is defined
        - oc_clients_unpacked.rc is defined
        - oc_clients_unpacked.rc > 0 
        - oc_clients_unpacked.stderr is defined
        - oc_clients_unpacked.stderr != "" 
        - not ' the file is 0 bytes' in oc_clients_unpacked.stderr != "" 
      with_items:
        - "{{ oc_client_binary }}"
        - "{{ oc_installer_binary }}"
      become: 'true'
      register: oc_clients_unpacked

    - name: Unpack terraform
      command: unzip -o "/tmp/{{ terraform_binary }}" -d /usr/local/bin/
      become: 'true'

    - name: '{{ ansible_name_module }} | command:which | Check if openshift-install-fips is installed'
      ansible.builtin.shell: >
        which openshift-install-fips 
      ignore_errors: yes
      register: oc_install_fips_binary_check

    - name: '{{ ansible_name_module }} | command:shell | set symlink if openshift-install-fips is installed'
      ansible.builtin.shell: >
        ln -s -f {{ oc_install_fips_binary_check.stdout }} {{ oc_install_fips_binary_check.stdout.split('-fips')[0] }} 
      when:
        - oc_install_fips_binary_check is defined
        - oc_install_fips_binary_check.rc is defined
        - oc_install_fips_binary_check.rc == 0 
        - oc_install_fips_binary_check.stdout is defined
        - oc_install_fips_binary_check.stdout != '' 
      become: 'true'

