---
- name: vars overlay
  hosts: localhost
  gather_facts: true
  vars:
    git_repo_branch: ''
    stage_dir: ''
    separate_git_dir: "{{ stage_dir }}/repo"
    project_dir: "{{ stage_dir }}/project"
    cluster_dir: ''
    git_repo: ''
    #Leave blank if executing locally, otherwises use saved credential from AAP Controller
    ssh_private_key_file: "{{ lookup('env', 'SSH_GIT_PRIVATE_KEY') | default(omit) }}"

  pre_tasks:
    - name: Ensure the cluster dir variable is set to a valid value
      ansible.builtin.assert:
        that:
          - cluster_dir is defined and cluster_dir != ""
        msg: " the cluster_dir must be set and valid "

    - name: Ensure the cluster git_repo  is set to a valid value if ssh private key not provided
      ansible.builtin.assert:
        that:
          - git_repo is defined and git_repo != ""
        msg: " the git_repo must be set and valid  when te ssh private key file not provided"
      when:
        - not ssh_private_key_file is defined or ssh_private_key_file == ''

    #- name: '{{ ansible_name_module }} | set_fact | git_repo '
    #  ansible.builtin.set_fact:
    #    git_repo: ""
    #  when:
    #    - not git_repo is defined
    #    - ssh_private_key_file is defined
    #    - ssh_private_key_file != ""

    - name: '{{ ansible_name_module }} | set_fact | git_repo_branch '
      ansible.builtin.set_fact:
        git_repo_branch: "main"
      when:
        - not git_repo_branch is defined or git_repo_branch == ''


    - name: '{{ ansible_name_module }} | set_fact | stage_dir '
      ansible.builtin.set_fact:
        stage_dir: "{{ lookup('env', 'HOME') }}/tmp"
      when:
        - not stage_dir is defined or stage_dir == ''

    - name: clean up tmp
      ansible.builtin.command: rm -rf {{ stage_dir }}

    - name: '{{ ansible_name_module }} | ansible.builtin.file | Ensure the staging dir exist '
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: 0777
      loop:
        - "{{ stage_dir }}"
        - "{{ stage_dir }}/platform"

    - ansible.builtin.debug:
        var: ssh_private_key_file

    - name: Checkout the vars variables uploads
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ project_dir }}"
        #separate_git_dir: "{{ separate_git_dir }}"
        single_branch: yes
        version: main
        update: yes
        key_file: "{{ ssh_private_key_file | default(omit) }}"
        remote: "{{ git_repo_branch }}"
        ssh_opts: "-o StrictHostKeyChecking=no"
      when:
        - git_repo is defined and git_repo != ''
        - cluster_dir is defined and cluster_dir != ''

    - name: Copy new variables
      ansible.builtin.copy:
        src: "{{ project_dir }}/{{ cluster_dir }}/vars/"
        dest: "{{ playbook_dir }}/vars"
        mode: '0655'
        directory_mode: '0755'
      when:
        - git_repo is defined and git_repo != ''
        - cluster_dir is defined and cluster_dir != ''

    - name: Remove decrypted vault file
      ansible.builtin.file:
        path: "{{ playbook_dir }}/vars/vault.yml"
        state: absent

    - name: Using shell to copy the vault file into place so that it is not decrypted
      ansible.builtin.command: >
        cp {{ project_dir }}/{{ cluster_dir }}/vars/vault.yml {{ playbook_dir }}/vars/



- hosts: local,localhost
  become: true
  
  vars_files:
  - vars/vault.yml
  - vars/bastion.yml
  - vars/common.yml
  - vars/cluster.yml
  - vars/fabric.yml

  tasks:
    ####### Retrieve release image info
    - name: '{{ ansible_name_module }} | shell:openshift_install version | get release image '
      ansible.builtin.shell: >
        {{ openshift_install_cli }} version | awk '/release image/ {print $3}'
      register: ocp_release_image_out
    
    - name: '{{ ansible_name_module }} | set_fact | ocp_release_image '
      ansible.builtin.set_fact:
        ocp_release_image: "{{ ocp_release_image_out.stdout }}"
      when:
        - ocp_release_image_out is defined
        - ocp_release_image_out.rc is defined
        - ocp_release_image_out.rc == 0
        - ocp_release_image_out.stdout is defined
        - ocp_release_image_out.stdout != ''


    - name: '{{ ansible_name_module }} | set_fact | file_decryption_staging_dir '
      ansible.builtin.set_fact:
        file_decryption_staging_dir: "{{ staging_dir | d('/tmp', true) }}/decrypted-files"
      when:
        - not file_decryption_staging_dir is defined or not file_decryption_staging_dir != ''

    - name: '{{ ansible_name_module }} | set_fact | oc_tools_extraction_staging_dir'
      ansible.builtin.set_fact:
        oc_tools_extraction_staging_dir: "{{ staging_dir | d('/tmp', true) }}/oc-tools"
      when:
        - not oc_tools_extraction_staging_dir is defined or not oc_tools_extraction_staging_dir != ''

    - name: '{{ ansible_name_module }} | ansible.builtin.file | Ensure the staging dir exist '
      ansible.builtin.file:
        path: "{{ file_decryption_staging_dir }}"
        state: directory
        mode: 0777

    - name: '{{ ansible_name_module }} | ansible.builtin.file | Ensure the staging dir exist '
      ansible.builtin.file:
        path: "{{ oc_tools_extraction_staging_dir }}"
        state: directory
        mode: 0777

    - name: '{{ ansible_name_module }} | decrypt file | pull secret config'
      ansible.builtin.copy:
        content: "{{ pull_secret_config_json_b64 | ansible.builtin.b64decode }}"
        dest: "{{ file_decryption_staging_dir }}/config.json"
        force: yes

    - name: '{{ ansible_name_module }} | set_fact | pull_secret_config_json_file '
      ansible.builtin.set_fact:
        pull_secret_config_json_file: "{{ file_decryption_staging_dir }}/config.json"

    ####### set pull secret
    - name: '{{ ansible_name_module }} | set_fact | pull_secret '
      ansible.builtin.set_fact:
        pull_secret: "{{ pull_secret_config_json_file }}"

    - name: '{{ ansible_name_module }} | ansible.builtin.shell:oc  | extract client from private registry'
      ansible.builtin.shell: >
        {{ openshift_cli }} adm release extract --tools=true \
        --icsp-file={{ ocp_idms_file }}
        -a {{ pull_secret }} \
        --from={{ registry_host_fqdn }}/{{ local_repository }}/{{ release_image_repository }}:{{ ocp_release_image_tag }}  \
        --to={{ oc_tools_extraction_staging_dir }}  
      when:
        - extract_clients is defined
        - extract_clients | bool 
      register: oc_clients_downloaded

    - name: '{{ ansible_name_module }} | ansible.builtin.shell:oc  | extract fips installer from private registry'
      ansible.builtin.shell: >
        {{ openshift_cli }} adm release extract --command=openshift-install-fips \
        --icsp-file={{ ocp_idms_file }}
        -a {{ pull_secret }} \
        --from={{ registry_host_fqdn }}/{{ local_repository }}/{{ release_image_repository }}:{{ ocp_release_image_tag }}  \
        --to={{ oc_tools_extraction_staging_dir }}  
      when:
        - extract_clients is defined
        - extract_clients | bool 
      register: fips_install_extacted

    - name: '{{ ansible_name_module }} | find | retrieve disco_ocp_tools_files files '
      ansible.builtin.shell: >
        ls -l {{ oc_tools_extraction_staging_dir }}/*.tar.gz | egrep -i "{{ bastion_os_version}}" | awk '{print $9}' 
      register: disco_ocp_tools_binary_files

    - name: '{{ ansible_name_module }} | debug | print disco_ocp_tools_files paths'
      ansible.builtin.debug:
        var: disco_ocp_tools_binary_files.stdout_lines 

    - name: Unpack oc binaries
      unarchive:
        src: "{{ item }}"
        dest: /usr/bin/
      loop: "{{ disco_ocp_tools_binary_files.stdout_lines }}"
      when:
        - disco_ocp_tools_binary_files is defined
        - disco_ocp_tools_binary_files.stdout_lines is defined
        - disco_ocp_tools_binary_files.stdout_lines | length > 0 

    - name: '{{ ansible_name_module }} | find | retrieved  fips installer files '
      ansible.builtin.shell: >
        ls -l {{ oc_tools_extraction_staging_dir }}/* | egrep -i "install-fips" | awk '{print $9}' 
      register: disco_installer_binary_files

    - name: '{{ ansible_name_module }} | copy | retrieved  fips installer files to location'
      ansible.builtin.copy: 
        src: "{{ disco_installer_binary_files.stdout }}"
        dest: "/usr/bin/{{ disco_installer_binary_files.stdout | basename }}"
        mode: 755
      register: install_fips_binary_copied

    - name: '{{ ansible_name_module }} | command:which | Check if openshift-install-fips is installed'
      ansible.builtin.shell: >
        which openshift-install-fips 
      ignore_errors: yes
      register: oc_install_fips_binary_check

    - name: '{{ ansible_name_module }} | command:shell | set symlink if openshift-install-fips is installed'
      ansible.builtin.shell: >
        ln -s -f {{ oc_install_fips_binary_check.stdout }} {{ oc_install_fips_binary_check.stdout.split('-fips')[0] }} 
      when:
        - oc_install_fips_binary_check is defined
        - oc_install_fips_binary_check.rc is defined
        - oc_install_fips_binary_check.rc == 0 
        - oc_install_fips_binary_check.stdout is defined
        - oc_install_fips_binary_check.stdout != '' 
      become: 'true'

